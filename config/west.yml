manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: tangbonze
      url-base: https://github.com/tangbonze
    - name: oleksandrmaslov
      url-base: https://github.com/oleksandrmaslov
    - name: kumamuk-git
      url-base: https://github.com/kumamuk-git
    - name: kot149
      url-base: https://github.com/kot149
    - name: zettaface
      url-base: https://github.com/zettaface
  projects:
    # Why: zettafaceフォークはinput_listener.cの1行修正を含む
    # プロセッサのSTOP戻り値を正しく伝播し、keybind使用時にカーソル移動を停止できる
    # See: https://github.com/zettaface/zmk/compare/zmkfirmware:main...zettaface:main
    - name: zmk
      remote: zettaface
      revision: main
      import: app/west.yml
    - name: zmk-pmw3610-driver
      remote: tangbonze
      revision: main
    - name: zmk-pointing-acceleration
      remote: oleksandrmaslov
      revision: main
    - name: zmk-scroll-snap
      remote: kot149
      revision: v1
    - name: zmk-input-processor-keybind
      remote: zettaface
      revision: main
  self:
    path: config
